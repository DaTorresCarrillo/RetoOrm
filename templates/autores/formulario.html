{% extends "base.html" %}

{% block title %}
    {% if autor %}Editar Autor{% else %}Nuevo Autor{% endif %} - Sistema de Biblioteca
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4>
                    {% if autor %}
                        <i class="fas fa-edit"></i> Editar Autor
                    {% else %}
                        <i class="fas fa-plus"></i> Nuevo Autor
                    {% endif %}
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre *</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" 
                               value="{{ autor.nombre if autor else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="nacionalidad" class="form-label">Nacionalidad</label>
                        <input type="text" class="form-control" id="nacionalidad" name="nacionalidad" 
                               value="{{ autor.nacionalidad if autor else '' }}" placeholder="Ej: Mexicana, Española, etc.">
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('autores.lista_autores') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 
                            {% if autor %}Actualizar{% else %}Guardar{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
