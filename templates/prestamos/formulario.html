{% extends "base.html" %}

{% block title %}Nuevo Préstamo - Sistema de Biblioteca{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4><i class="fas fa-plus"></i> Nuevo Préstamo</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="libro_id" class="form-label">Libro *</label>
                                <select class="form-control" id="libro_id" name="libro_id" required>
                                    <option value="">Selecciona un libro</option>
                                    {% for libro in libros %}
                                    <option value="{{ libro.id }}">{{ libro.titulo }} - {{ libro.autor.nombre if libro.autor else '' }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="usuario_id" class="form-label">Usuario *</label>
                                <select class="form-control" id="usuario_id" name="usuario_id" required>
                                    <option value="">Selecciona un usuario</option>
                                    {% for usuario in usuarios %}
                                    <option value="{{ usuario.id }}">{{ usuario.nombre }} - {{ usuario.email }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="dias_prestamo" class="form-label">Días de Préstamo</label>
                                <input type="number" class="form-control" id="dias_prestamo" name="dias_prestamo" 
                                       value="7" min="1" max="30">
                                <small class="form-text text-muted">Por defecto: 7 días</small>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('prestamos.lista_prestamos') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Registrar Préstamo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
