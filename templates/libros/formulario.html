{% extends "base.html" %}

{% block title %}
    {% if libro %}Editar Libro{% else %}Nuevo Libro{% endif %} - Sistema de Biblioteca
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4>
                    {% if libro %}
                        <i class="fas fa-edit"></i> Editar Libro
                    {% else %}
                        <i class="fas fa-plus"></i> Nuevo Libro
                    {% endif %}
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="titulo" class="form-label">Título *</label>
                                <input type="text" class="form-control" id="titulo" name="titulo" 
                                       value="{{ libro.titulo if libro else '' }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="autor_id" class="form-label">Autor *</label>
                                <select class="form-control" id="autor_id" name="autor_id" required>
                                    <option value="">Selecciona un autor</option>
                                    {% for autor in autores %}
                                    <option value="{{ autor.id }}" 
                                            {% if libro and libro.autor_id == autor.id %}selected{% endif %}>
                                        {{ autor.nombre }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="genero" class="form-label">Género</label>
                                <input type="text" class="form-control" id="genero" name="genero" 
                                       value="{{ libro.genero if libro else '' }}" placeholder="Ej: Novela, Ciencia Ficción, etc.">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="año_publicacion" class="form-label">Año de Publicación</label>
                                <input type="number" class="form-control" id="año_publicacion" name="año_publicacion" 
                                       value="{{ libro.año_publicacion if libro else '' }}" 
                                       min="1000" max="{{ now.year }}" placeholder="Ej: 2023">
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('libros.lista_libros') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 
                            {% if libro %}Actualizar{% else %}Guardar{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
