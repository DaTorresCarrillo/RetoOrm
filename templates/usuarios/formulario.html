{% extends "base.html" %}

{% block title %}
    {% if usuario %}Editar Usuario{% else %}Nuevo Usuario{% endif %} - Sistema de Biblioteca
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4>
                    {% if usuario %}
                        <i class="fas fa-edit"></i> Editar Usuario
                    {% else %}
                        <i class="fas fa-plus"></i> Nuevo Usuario
                    {% endif %}
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre *</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" 
                               value="{{ usuario.nombre if usuario else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email *</label>
                        <input type="email" class="form-control" id="email" name="email" 
                               value="{{ usuario.email if usuario else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="tel" class="form-control" id="telefono" name="telefono" 
                               value="{{ usuario.telefono if usuario else '' }}" placeholder="Ej: 555-1234">
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('usuarios.lista_usuarios') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 
                            {% if usuario %}Actualizar{% else %}Guardar{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
